web:
  node_host: "43.139.192.176" # node的主机
  port_range: # frp端口范围，用于分配给node的frp端口
    - 8191
    - 8220 
  ms_clear_host: "43.139.192.176" # 清空端口列表的web服务主机
  ms_clear_port: 8190 # 清空端口列表的web服务端口
  ms_clear_url: "/clear" # 清空端口列表的web服务url
  max_worker: 16 # 最大并发数
  timeout: 10 # 超时时间
  
monitor:
  interval: 120 # 每隔 N 秒请求一次状态，查看还有多少端口在运行
  first_delay_multiplier: 2  # 首次节点检查延后 = interval×此值（默认3），避免启动时空节点列表导致数据过早过期，可选 4  
