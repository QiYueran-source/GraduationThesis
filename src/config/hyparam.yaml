# 超参数配置
# 约定：顶层 = 固定（环境统一），train_config = 随机（agent 异质性）

# 股票池与数据质量
stock_pool:
  pool_type: test
  data_quality_threshold: 0.8

meta_seed: 42

# 节点 meta：由主机提供
# 【顶层 = 固定】
meta:
  start_year: 1997
  end_year: 2024
  earliest_year_month: [1997, 1]
  n: 10
  max_portfolios_num: 500
  env_config:
    rf_end_year: 2015   # 强化学习结束年份，月份默认 12
  performance_config:
    risk_free_rate: 0.015
    rolling_window: 24

  # 【train_config = 随机】下面为 range/选项，由 node_manager 随机采样
  train_config:
    seed_range: [1, 1000]
    m_range: [1, 12]
    mask_len_range: [44, 88]
    model_config:
      cate_type: [0]
      dropout_range: [0.00, 0.25]
      # config 按 cate 选择
    reinforcement_config:
      cate: [0]
      lr_range: [1e-5, 1e-3]
      clip_grad_norm_range: [0.5, 1.0]
      weight_decay_range: [0, 0.01]
    reward_config:
      # reward_weights: rtr / vol / sharpe / max_drawdown 随机生成且和为 1

# redis 数据冗余配置
redis_redundancy:
  interval: 5
  min_periods_year: 1
  max_periods_year: 3

# redis 数据过期配置
redis_expiration:
  interval: 5
  clean_up_threshold: 0.85
  clean_up_countdown: 300
